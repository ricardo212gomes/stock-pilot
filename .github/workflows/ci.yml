# Checks every pull request (and develop and main) before merging; Vercel's preview deployment is the other check.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The reviews' parsing tests need only the standard library, not TradingAgents.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover agents
